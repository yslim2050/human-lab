---
layout: default
---
<div class="wrap">
  <div class="sub-wrap">

    {% include sidebar.html %}

    <div class="content" id="content">

      <div class="content-head">
        <h1 class="content-title">{{ page.title }}</h1>
        <div class="crumb">
          <a href="{{ '/' | relative_url }}" class="home" aria-label="HOME">&#8962;</a>
          <span>{{ page.tab }}</span>
          <span>&gt;</span>
          <span>{{ page.title }}</span>
        </div>
      </div>

      {{ content }}

    </div>

  </div>
</div>
